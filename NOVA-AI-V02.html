<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA AI 0.2</title><style>body{background:#101827;color:#eef4ff;font:17px system-ui;margin:0}main{max-width:720px;margin:auto;padding:20px}section{background:#1e293b;padding:18px;border-radius:20px;margin:15px 0}button,select,input{font:inherit;border:0;border-radius:12px;padding:12px;margin:5px 0}button{background:#91b7ff;color:#101827;cursor:pointer}button:disabled{opacity:.4}select,input{width:100%;box-sizing:border-box}#chat{min-height:180px;max-height:45vh;overflow:auto}.bubble{white-space:pre-wrap;padding:12px;border-radius:15px;margin:8px 0;background:#334155;overflow-wrap:anywhere}.user{background:#245b68;margin-left:20%}.assistant{margin-right:20%}small{color:#b5c6dc}progress{width:100%}</style><main><h1>NOVA AI <small>V0.2</small></h1><section><label>النموذج</label><select id="model"><option>Qwen2.5-1.5B-Instruct-q4f16_1-MLC</option><option>Qwen2.5-0.5B-Instruct-q4f16_1-MLC</option></select><button id="check">فحص التوافق</button> <button id="load">تحميل النموذج</button><progress id="progress" max="1" value="0"></progress><p id="status" role="status">لم يتم تحميل النموذج</p><small>يتطلب HTTPS وWebGPU. قد يستغرق التحميل وقتاً ويستهلك أكثر من 1GB. لا تدخل معلومات شخصية.</small></section><section><h2>عمر الحديدي</h2><small>شخصية خيالية • ذاكرة محلية</small><div id="chat"></div><form id="form"><input id="msg" placeholder="اكتب رسالة..." maxlength="500" autocomplete="off"><button id="send" disabled>إرسال</button></form><button id="clear">حذف ذاكرة المحادثة</button></section></main><script type="module">
const $=id=>document.getElementById(id);let engine=null,busy=false,history=[];const key='nova-ai-v02-history';try{const h=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(h))history=h.filter(x=>['user','assistant'].includes(x.role)&&typeof x.content==='string').slice(-24)}catch{};
function status(s){$('status').textContent=s}function render(){const c=$('chat');c.replaceChildren();for(const h of history){let d=document.createElement('div');d.className='bubble '+h.role;d.textContent=(h.role==='user'?'أنت: ':'عمر: ')+h.content;c.append(d)}c.scrollTop=c.scrollHeight}function save(){try{localStorage.setItem(key,JSON.stringify(history.slice(-24)))}catch{status('تعذر حفظ الذاكرة على الجهاز')}}function controls(){ $('send').disabled=busy||!engine;$('load').disabled=busy;$('model').disabled=busy;$('clear').disabled=busy}render();
$('check').onclick=async()=>{try{if(!navigator.gpu)throw Error('WebGPU غير متاح');const a=await navigator.gpu.requestAdapter();if(!a)throw Error('لا يوجد محول رسومي متوافق');status('WebGPU متاح. نجاح تشغيل النموذج يحتاج تجربة التحميل.')}catch(e){status(e.message)}};
$('load').onclick=async()=>{busy=true;controls();try{if(!navigator.gpu)throw Error('WebGPU غير متاح');if(engine){await engine.unload();engine=null}status('جاري تحميل المكتبة...');const lib=await import('https://esm.run/@mlc-ai/web-llm');const id=$('model').value;if(!lib.prebuiltAppConfig.model_list.some(x=>x.model_id===id))throw Error('النموذج غير موجود في قائمة هذه النسخة');engine=await lib.CreateMLCEngine(id,{initProgressCallback:r=>{$('progress').value=r.progress;status(r.text)}});status('النموذج جاهز للمحادثة')}catch(e){engine=null;status('تعذر التحميل: '+e.message+' — جرّب النموذج الأصغر.')}finally{busy=false;controls()}};
const prompt='أنت عمر الحديدي، شخصية خيالية في لعبة NOVA LIFE. أنت أخ جهاد الحديدي. تعيش مع عائلتك في مدينة نوفا. تتحدث باللهجة الأردنية بشكل طبيعي. أجب عن آخر رسالة مباشرة بجملة أو جملتين فقط. تذكر سياق الرسائل السابقة ولا تكررها. مثال: كيفك؟ الحمد لله تمام، إنت كيفك؟ مثال: وينك؟ بالبيت مع الأهل. لا تدّع تنفيذ أفعال حقيقية خارج اللعبة. حافظ على محتوى مناسب للمراهقين، ولا تقدم إرشادات خطرة أو غير قانونية أو محتوى جنسي أو مؤذياً.';
$('form').onsubmit=async e=>{e.preventDefault();const msg=$('msg').value.trim();if(!msg||!engine||busy)return;busy=true;controls();$('msg').value='';history.push({role:'user',content:msg});render();save();status('عمر يكتب...');try{const r=await engine.chat.completions.create({messages:[{role:'system',content:prompt},...history.slice(-11)],temperature:0.65,max_tokens:100});const reply=r.choices[0]?.message?.content?.trim();if(!reply)throw Error('رد فارغ');history.push({role:'assistant',content:reply});history=history.slice(-24);save();render();status('النموذج جاهز')}catch(e){status('تعذر توليد الرد: '+e.message)}finally{busy=false;controls()}};
$('clear').onclick=()=>{if(confirm('حذف سجل المحادثة؟')){history=[];save();render()}};
</script></html>
